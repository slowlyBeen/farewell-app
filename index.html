<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕히 계세요 여러분~ 🌸</title>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, updateDoc, serverTimestamp }
            from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js';
        import { getAuth, signInAnonymously }
            from 'https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBRHE6XVUO1i3mtLowSbNokYucEQC8pAZw",
            authDomain: "goodbye-17f4c.firebaseapp.com",
            projectId: "goodbye-17f4c",
            storageBucket: "goodbye-17f4c.firebasestorage.app",
            messagingSenderId: "182635911718",
            appId: "1:182635911718:web:16f6f93bee148f07b724e7",
            measurementId: "G-Z17D35TYVM"
        };

        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const auth = getAuth(app);

        // 익명 로그인 후 앱 시작 (Firestore Rules 인증 연동용)
        await signInAnonymously(auth);

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UUID v4 생성
        function uuidv4() {
            return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
        }

        // ── 라우팅 ──────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        const msgId  = params.get('id');
        const isAdmin = params.get('admin') === '1';

        window.addEventListener('DOMContentLoaded', () => {
            if (msgId) {
                showViewPage(msgId);
            } else if (isAdmin) {
                showAdminPage();
            } else {
                showLandingPage();
            }
        });

        // ── 랜딩 ────────────────────────────────────────────────
        function showLandingPage() {
            document.getElementById('landing').style.display = 'flex';
        }

        // ── 관리자 페이지 ────────────────────────────────────────
        function showAdminPage() {
            document.getElementById('admin').style.display = 'flex';
            renderAdminUI();
        }

        function renderAdminUI() {
            const container = document.getElementById('admin');
            container.innerHTML = `
      <div class="admin-wrap">
        <div class="admin-header">
          <div class="crown">👑</div>
          <h1 class="admin-title">메시지 작성 패널</h1>
          <p class="admin-sub">팀원별 마음 담은 편지를 작성하세요</p>
        </div>

        <div class="card form-card">
          <div class="form-row">
            <label>받는 사람</label>
            <input id="toName" type="text" placeholder="예) 김철수" class="inp" />
          </div>
          <div class="form-row">
            <label>메시지</label>
            <textarea id="msgText" placeholder="진심을 담아 써주세요 💌" class="inp textarea" rows="6"></textarea>
          </div>
          <button id="saveBtn" class="btn-primary" onclick="window._saveMsg()">
            저장 &amp; QR 생성 ✨
          </button>
        </div>

        <div id="qrResult" class="qr-result" style="display:none">
          <div class="card qr-card">
            <p class="qr-name-label">📬 <span id="qrName"></span> 님의 QR</p>
            <div id="qrCanvas" class="qr-box"></div>
            <p class="qr-url-label" id="qrUrl"></p>
            <button class="btn-secondary" onclick="window._printQR()">🖨️ QR 인쇄 / 저장</button>
          </div>
        </div>

        <div id="savedList" class="saved-list"></div>
      </div>
    `;

            window._saveMsg = async () => {
                const to  = document.getElementById('toName').value.trim();
                const msg = document.getElementById('msgText').value.trim();
                if (!to || !msg) { showToast('이름과 메시지를 모두 입력해주세요!'); return; }

                const btn = document.getElementById('saveBtn');
                btn.disabled = true; btn.textContent = '저장 중...';

                const id = uuidv4();
                await setDoc(doc(db, 'messages', id), {
                    to, message: msg,
                    viewed: false,
                    createdAt: serverTimestamp()
                });

                const url = `${location.origin}${location.pathname}?id=${id}`;
                document.getElementById('qrResult').style.display = 'block';
                document.getElementById('qrName').textContent = to;
                document.getElementById('qrUrl').textContent = url;

                // QR 생성
                document.getElementById('qrCanvas').innerHTML = '';
                new QRCode(document.getElementById('qrCanvas'), {
                    text: url, width: 200, height: 200,
                    colorDark: '#1a0533', colorLight: '#fff8f0',
                    correctLevel: QRCode.CorrectLevel.H
                });

                btn.disabled = false; btn.textContent = '저장 & QR 생성 ✨';
                document.getElementById('toName').value = '';
                document.getElementById('msgText').value = '';

                addToSavedList(to, url, id);
                showToast(`${to}님 메시지 저장 완료! 🎉`);
            };

            window._printQR = () => window.print();

            window._savedItems = [];
            function addToSavedList(to, url, id) {
                window._savedItems.unshift({ to, url, id });
                const list = document.getElementById('savedList');
                list.innerHTML = `<h3 class="saved-title">📋 생성된 QR 목록</h3>` +
                    window._savedItems.map(item => `
          <div class="saved-item">
            <span class="saved-name">${item.to}</span>
            <a href="${item.url}" target="_blank" class="saved-link">열기</a>
          </div>
        `).join('');
            }
        }

        // ── 메시지 열람 ──────────────────────────────────────────
        async function showViewPage(id) {
            const page = document.getElementById('viewPage');
            page.style.display = 'flex';

            const ref = doc(db, 'messages', id);
            const snap = await getDoc(ref);

            if (!snap.exists()) {
                renderViewContent('notfound'); return;
            }

            const data = snap.data();

            if (data.viewed) {
                renderViewContent('expired'); return;
            }

            // 1회 열람 소멸 처리
            await updateDoc(ref, { viewed: true, viewedAt: serverTimestamp() });

            renderViewContent('message', data);
        }

        function renderViewContent(state, data) {
            const page = document.getElementById('viewPage');

            if (state === 'notfound') {
                page.innerHTML = `
        <div class="msg-wrap">
          <div class="card msg-card error-card">
            <div class="error-icon">🔍</div>
            <h2>메시지를 찾을 수 없어요</h2>
            <p>링크가 잘못되었거나 이미 삭제된 메시지입니다.</p>
          </div>
        </div>`;
                return;
            }

            if (state === 'expired') {
                page.innerHTML = `
        <div class="msg-wrap">
          <div class="card msg-card error-card">
            <div class="error-icon">🌸</div>
            <h2>이미 열람된 메시지예요</h2>
            <p>이 메시지는 1회만 열람 가능합니다.<br>소중한 순간을 기억해주세요 💕</p>
          </div>
        </div>`;
                return;
            }

            // 메시지 표시
            page.innerHTML = `
      <div class="msg-wrap">
        <div class="envelope-anim">💌</div>
        <div class="card msg-card">
          <p class="msg-to">To. <strong>${data.to}</strong> 님께</p>
          <div class="msg-divider"></div>
          <p class="msg-body">${data.message.replace(/\n/g, '<br>')}</p>
          <div class="msg-divider"></div>
          <p class="msg-from">From. 봄이 🌸</p>
          <p class="msg-once">⚠️ 이 메시지는 1회만 열람 가능합니다</p>
        </div>
      </div>`;
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
    </script>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Dela+Gothic+One&display=swap');

        :root {
            --sky:    #b8e8ff;
            --pink:   #ffb3d1;
            --deep:   #1a0533;
            --gold:   #f5c842;
            --cream:  #fff8f0;
            --card-bg:#ffffffee;
            --accent: #e8457a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Serif KR', serif;
            background: linear-gradient(160deg, var(--sky) 0%, #d4b8ff 50%, var(--pink) 100%);
            min-height: 100vh;
            color: var(--deep);
        }

        /* ── 랜딩 ── */
        #landing {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .hero-img {
            width: min(380px, 90vw);
            border-radius: 1rem;
            box-shadow: 0 8px 40px #0003;
            animation: floatY 3s ease-in-out infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes floatY {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        .hero-bubble {
            background: var(--card-bg);
            border: 3px solid var(--gold);
            border-radius: 1.2rem;
            padding: 1.5rem 2rem;
            max-width: 440px;
            text-align: center;
            box-shadow: 6px 6px 0 var(--gold);
            margin-bottom: 2rem;
        }

        .hero-bubble h1 {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: var(--accent);
            margin-bottom: .5rem;
        }

        .hero-bubble p {
            font-size: .95rem;
            line-height: 1.7;
            color: var(--deep);
        }

        .subtitle {
            font-size: .8rem;
            color: #888;
            margin-top: 1.5rem;
        }

        /* ── 공통 카드 ── */
        .card {
            background: var(--card-bg);
            border-radius: 1.2rem;
            padding: 2rem;
            box-shadow: 0 4px 24px #0002;
            backdrop-filter: blur(8px);
        }

        /* ── 관리자 ── */
        #admin {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .admin-wrap { width: 100%; max-width: 560px; }

        .admin-header { text-align: center; margin-bottom: 1.5rem; }
        .crown { font-size: 2.5rem; }
        .admin-title {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 1.6rem;
            color: var(--deep);
        }
        .admin-sub { color: #666; font-size: .9rem; margin-top: .3rem; }

        .form-card { margin-bottom: 1.5rem; }
        .form-row { margin-bottom: 1rem; }
        .form-row label { display: block; font-weight: 700; margin-bottom: .4rem; font-size: .9rem; }

        .inp {
            width: 100%;
            padding: .75rem 1rem;
            border: 2px solid #ddd;
            border-radius: .8rem;
            font-family: 'Noto Serif KR', serif;
            font-size: .95rem;
            background: var(--cream);
            outline: none;
            transition: border-color .2s;
        }
        .inp:focus { border-color: var(--accent); }
        .textarea { resize: vertical; }

        .btn-primary {
            width: 100%;
            padding: .9rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: .8rem;
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #b0234d;
            transition: transform .1s, box-shadow .1s;
        }
        .btn-primary:hover  { transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #b0234d; }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

        .btn-secondary {
            padding: .6rem 1.2rem;
            background: var(--gold);
            color: var(--deep);
            border: none;
            border-radius: .6rem;
            font-family: 'Dela Gothic One', sans-serif;
            cursor: pointer;
            margin-top: .8rem;
        }

        /* ── QR 결과 ── */
        .qr-result { margin-bottom: 1.5rem; }
        .qr-card { text-align: center; }
        .qr-name-label { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
        .qr-box { display: inline-block; padding: .8rem; background: #fff; border-radius: .5rem; }
        .qr-url-label { font-size: .7rem; color: #888; margin-top: .6rem; word-break: break-all; }

        /* ── 저장 목록 ── */
        .saved-list { margin-top: 1rem; }
        .saved-title { font-family: 'Dela Gothic One', sans-serif; margin-bottom: .8rem; font-size: 1rem; }
        .saved-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border-radius: .6rem; padding: .7rem 1rem;
            margin-bottom: .5rem; box-shadow: 0 2px 8px #0001;
        }
        .saved-name { font-weight: 700; }
        .saved-link {
            color: var(--accent); font-size: .85rem; text-decoration: none;
            border: 1px solid var(--accent); border-radius: .4rem; padding: .2rem .6rem;
        }

        /* ── 메시지 열람 ── */
        #viewPage {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        .msg-wrap { width: 100%; max-width: 480px; text-align: center; }

        .envelope-anim {
            font-size: 4rem;
            animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
            margin-bottom: 1.5rem;
        }
        @keyframes popIn {
            from { transform: scale(0) rotate(-15deg); opacity: 0; }
            to   { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .msg-card {
            animation: slideUp .5s .3s both;
            text-align: left;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .msg-to { font-size: 1rem; color: #888; margin-bottom: .8rem; }
        .msg-to strong { color: var(--deep); font-size: 1.2rem; }
        .msg-divider { border-top: 1px dashed #ccc; margin: 1rem 0; }
        .msg-body { font-size: 1.05rem; line-height: 1.9; color: var(--deep); white-space: pre-wrap; }
        .msg-from { text-align: right; color: var(--accent); font-weight: 700; margin-top: .5rem; }
        .msg-once { font-size: .75rem; color: #aaa; text-align: center; margin-top: 1rem; }

        .error-card { text-align: center; }
        .error-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .error-card h2 { font-family: 'Dela Gothic One', sans-serif; margin-bottom: .5rem; }
        .error-card p { color: #666; line-height: 1.7; }

        /* ── 토스트 ── */
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: var(--deep); color: #fff; padding: .8rem 1.5rem;
            border-radius: 2rem; font-size: .9rem; z-index: 999;
            animation: fadeInOut 3s forwards;
        }
        @keyframes fadeInOut {
            0%   { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            80%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ── 인쇄 ── */
        @media print {
            body > *:not(#admin) { display: none !important; }
            .qr-result { display: block !important; }
            .btn-primary, .btn-secondary, .saved-list, .form-card, .admin-header { display: none !important; }
        }
    </style>
</head>
<body>

<!-- 랜딩 -->
<div id="landing">
    <img src="farewell.png" alt="안녕히 계세요" class="hero-img" />
    <div class="hero-bubble">
        <h1>안녕히 계세요 여러분~ 🌸</h1>
        <p>전 이 세상의 모든 굴레와 속박을 벗어던지고<br>제 행복을 찾아 떠납니다…</p>
        <p style="margin-top:1rem; color:#e8457a; font-weight:700">
            📬 개인 QR 코드를 받으셨나요?<br>
            <span style="font-weight:400; color:#555">QR을 스캔하면 당신만의 메시지를 볼 수 있어요</span>
        </p>
    </div>
    <p class="subtitle">메시지는 1회만 열람 가능합니다 · 다른 사람의 메시지는 볼 수 없어요</p>
</div>

<!-- 관리자 -->
<div id="admin"></div>

<!-- 열람 -->
<div id="viewPage"></div>

</body>
</html>
